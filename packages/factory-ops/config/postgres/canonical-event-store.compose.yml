services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${CANONICAL_EVENT_STORE_ROOT}/data:/var/lib/postgresql/data
      - ${CANONICAL_EVENT_STORE_ROOT}/backups:/backups
      - ${CANONICAL_EVENT_STORE_ROOT}/restore:/restore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 30
