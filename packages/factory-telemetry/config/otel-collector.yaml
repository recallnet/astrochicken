receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:OTEL_COLLECTOR_HTTP_ENDPOINT:-0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_COLLECTOR_MEMORY_LIMIT_MIB:-256}
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
